name: Profile Metrics

# Replaces the public Vercel widgets (github-readme-stats, github-profile-trophy,
# github-readme-activity-graph), which are disabled. Renders SVGs into this repo.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: Render profile SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Stats
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: modem7
          template: classic
          filename: metrics/stats.svg
          base: repositories, community
          config_timezone: Europe/London

      - name: Top languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: modem7
          template: classic
          filename: metrics/languages.svg
          base: ""
          config_timezone: Europe/London
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html

  trophies:
    name: Render trophies
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate trophy SVG
        # ryo-ma/github-profile-trophy master as of 2026-10-27
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: modem7
          output_path: metrics/trophies.svg
          theme: onedark
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/trophies.svg
          if git diff --cached --quiet; then
            echo "No trophy changes"
          else
            git commit -m ":trophy: update trophies"
            git pull --rebase
            git push
          fi
